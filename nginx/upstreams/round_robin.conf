# Round Robin (default): no algorithm directive. Requests go to web1, web2, web3,
# web1, ... in turn, skipping servers marked as failed. Best when replicas are equal
# and requests cost about the same.
upstream backend {
    # `zone` keeps the balancer state (round-robin position, failure counters, active
    # connection counts) in shared memory, so all Nginx worker processes act as ONE
    # balancer. Without it each worker would rotate independently.
    zone backend 64k;
    # Passive health check: after 2 failed attempts within 10 s the server is
    # considered unavailable for the next 10 s, then Nginx tries it again.
    server web1:8000 resolve max_fails=2 fail_timeout=10s;
    server web2:8000 resolve max_fails=2 fail_timeout=10s;
    server web3:8000 resolve max_fails=2 fail_timeout=10s;

    keepalive 32;   # idle keepalive connections to the replicas kept per worker
}
