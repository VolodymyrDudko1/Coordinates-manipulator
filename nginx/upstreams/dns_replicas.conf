# Variant for `deploy.replicas` (docker-compose.replicas.yml): ONE service name "web"
# that Docker DNS (127.0.0.11) resolves to N container IPs. With `resolve`, Nginx
# turns every A record into a peer and re-reads the list every `valid` seconds, so
# `docker compose up --scale web=5` is picked up without reloading Nginx.
upstream backend {
    zone backend 64k;
    server web:8000 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;
}
