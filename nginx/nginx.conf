# Nginx reverse proxy + load balancer for the portal API (Lab 6).
# Mounted read-only at /etc/nginx/nginx.conf by docker-compose.lb.yml.

worker_processes auto;                 # one worker per CPU core
error_log /var/log/nginx/error.log warn;   # -> stderr of the container (docker compose logs nginx)
pid /tmp/nginx.pid;

events {
    worker_connections 1024;           # max simultaneous connections per worker (client + upstream)
}

http {
    # Access log with the balancing details: which upstream served the request,
    # its status and timings. Several values appear comma-separated when Nginx
    # had to try another server (proxy_next_upstream), e.g. "172.20.0.5:8000, 172.20.0.6:8000".
    log_format upstreamlog '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                           'rt=$request_time upstream=$upstream_addr '
                           'ustatus=$upstream_status urt=$upstream_response_time '
                           'uct=$upstream_connect_time';
    access_log /var/log/nginx/access.log upstreamlog;   # -> stdout

    sendfile on;
    keepalive_timeout 65s;
    server_tokens off;                 # do not advertise the Nginx version

    # The `upstream backend { ... }` block lives in a separate file so the balancing
    # algorithm can be switched without touching this config:
    #   LB_ALGO=round_robin | weighted | least_conn | ip_hash | single
    # docker-compose.lb.yml mounts nginx/upstreams/${LB_ALGO}.conf at this path.
    include /etc/nginx/upstream.conf;

    # Docker's embedded DNS. With `resolve` on the upstream servers Nginx re-resolves
    # web1..3 every `valid` seconds instead of once at startup: a restarted container
    # may come back with a NEW IP (verified: web2 172.20.0.4 -> 172.20.0.7), and its old
    # IP may already belong to another container. Also lets Nginx start while a replica
    # is down. Requires `zone` in the upstream (open-source Nginx >= 1.27.3).
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    server {
        listen 80;
        server_name _;

        # Make the chosen backend visible to the client (IP:port of the replica);
        # `always` also adds it to 4xx/5xx responses.
        add_header X-Upstream $upstream_addr always;

        # Liveness of Nginx itself (used by the compose healthcheck), not proxied.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://backend;

            # HTTP/1.1 + empty Connection header => reuse upstream keepalive connections.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Pass the original request context to the app.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts: a dead replica is detected quickly at connect time, while a
            # slow-but-alive one (bcrypt queue, see Lab 4) may take up to 60 s,
            # the same limit the Locust client uses.
            proxy_connect_timeout 2s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;

            # Passive failover: on these conditions retry the request on the next
            # server. At most 2 attempts in total and within 10 s. Non-idempotent
            # requests (POST) are NOT retried once they reached a server - Nginx's
            # default safety rule - so a registration is never executed twice.
            proxy_next_upstream         error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   2;
            proxy_next_upstream_timeout 10s;
        }
    }
}
