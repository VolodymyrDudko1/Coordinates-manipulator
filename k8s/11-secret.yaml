# Secret: чутливі дані (паролі, ключі). Зберігаються в etcd окремо від ConfigMap,
# доступ можна обмежити через RBAC. УВАГА: base64 — це кодування, а не шифрування.
# Значення тут свідомо фейкові: справжні секрети в Git не комітять.
apiVersion: v1
kind: Secret
metadata:
  name: portal-secret
  namespace: dudko
  labels:
    app.kubernetes.io/name: portal-api
    app.kubernetes.io/part-of: portal-generator
type: Opaque              # довільні пари ключ=значення (не TLS, не docker-registry)
stringData:               # stringData = звичайний текст; Kubernetes сам закодує в base64 (поле data)
  # Пароль БД: використовують і postgres, і застосунок (у DATABASE_URL).
  # Лише символи, безпечні для URL, бо пароль підставляється в рядок підключення.
  POSTGRES_PASSWORD: "dev-only-not-real-db-password"
  # Ключ підпису JWT-токенів (>= 32 байти для HS256).
  SECRET_KEY: "dev-only-not-real-jwt-signing-key-0123456789"
  # Демонстраційний API-ключ: на сторінці видно лише "de***".
  API_KEY: "dev-only-not-real"
