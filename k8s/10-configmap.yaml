# ConfigMap: НЕсекретна конфігурація застосунку у вигляді пар ключ=значення.
# Pod-и отримують усі ключі як змінні оточення через envFrom (див. 20-deployment.yaml).
# Зміна ConfigMap НЕ перезапускає pod-и автоматично: потрібен `kubectl rollout restart`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-config
  namespace: dudko        # namespace задаємо явно в кожному об'єкті
  labels:
    app.kubernetes.io/name: portal-api
    app.kubernetes.io/part-of: portal-generator
data:                     # усі значення в ConfigMap — рядки, тому числа/булеві беремо в лапки
  # --- Параметри застосунку, які показуються на головній сторінці ---
  APP_GREETING: "Привіт з Kubernetes! Генератор багатовимірних порталів"
  LOG_LEVEL: "INFO"       # рівень логування Python: DEBUG / INFO / WARNING / ERROR
  # --- Профіль застосунку (src/config.py) ---
  ENVIRONMENT: "sandbox"  # дозволені значення: sandbox / production / testing
  DEBUG: "False"          # False => клієнт не бачить стектрейсів при помилці 500
  # --- Параметри PostgreSQL (не секретні) ---
  # Ці ж ключі читає офіційний образ postgres при першому запуску.
  POSTGRES_DB: "portal_db"
  POSTGRES_USER: "portal"
  DB_HOST: "portal-db"    # DNS-ім'я Service бази даних (14-postgres-service.yaml)
  DB_PORT: "5432"
