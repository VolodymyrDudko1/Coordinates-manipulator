# .pre-commit-config.yaml
repos:
  # 1. Standard Git Hook Cleansers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace      # Trims trailing whitespace
      - id: end-of-file-fixer        # Ensures files end with a newline
      - id: check-yaml               # Validates YAML syntax integrity
        args: [ --allow-multiple-documents ]
        # Helm templates are Go templates, not plain YAML ({{- ... }}); `helm lint` checks them.
        exclude: ^charts?/[^/]+/templates/
      - id: check-added-large-files  # Blocks heavy binaries (>500KB) from git tracking
        # Locust HTML reports (~950 KB each) are kept on purpose as load-test evidence.
        exclude: ^load-tests/results/

  # 2. Ultra-fast Ruff Quality Gate
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff                     # Runs static analysis linting checks
        args: [ --fix ]              # Automatically patches safe issues (like unused imports)
      - id: ruff-format              # Re-formats code layout to PEP 8 automatically
