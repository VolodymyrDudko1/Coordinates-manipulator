{% load static %}
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="{% static 'simulator/css/style.css' %}"></head>
<body class="auth-shell"><main class="auth-card"><h1>Create operator account</h1>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button type="submit">Register</button></form><p>Already registered? <a href="{% url 'login' %}">Sign in</a></p></main></body>
</html>
