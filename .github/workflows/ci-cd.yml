name: CI/CD

on:
  pull_request:
  push:
    branches:
      - "**"
    # Lab 5: a semver tag (git tag -a v1.2.0 -m "...") publishes backend:1.2.0 for Argo CD.
    tags:
      - "v*"
    # Config-only commits (the Lab 5-7 demos push many) do not change the image: skip CI.
    # GitHub does not apply path filters to tag pushes, so v* tags always build.
    paths-ignore:
      - "envs/**"
      - "argocd-apps/**"
      - "bootstrap/**"
      - "charts/**"
      - "chart/**"
      - "k8s/**"
      - "scripts/**"
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  backend:
    name: Backend / lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: multidimensional-portal-generator/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r multidimensional-portal-generator/requirements.txt ruff

      - name: Static analysis
        run: ruff check multidimensional-portal-generator

      - name: Build
        run: python -m compileall -q multidimensional-portal-generator/src

      - name: Test
        working-directory: multidimensional-portal-generator
        run: pytest -q

  client:
    name: Client / lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal_client/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r portal_client/requirements.txt ruff

      - name: Static analysis
        run: ruff check portal_client

      - name: Build
        working-directory: portal_client
        run: python -m compileall -q . && python manage.py check

      - name: Test
        working-directory: portal_client
        run: python manage.py test

  images:
    name: Build and scan ${{ matrix.service }} image
    needs: [backend, client]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile.backend
          - service: client
            dockerfile: Dockerfile.client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute app version
        # Tag v1.2.0 -> APP_VERSION=1.2.0 and the annotated tag message as the release note;
        # any other push -> APP_VERSION=sha-<short> (still a unique, non-latest tag).
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            git fetch --no-tags --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            NOTE="$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")"
          else
            VERSION="sha-${GITHUB_SHA::7}"
            NOTE=""
          fi
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APP_RELEASE_NOTE=${NOTE:-Release ${VERSION} (commit ${GITHUB_SHA::7})}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build --file "${{ matrix.dockerfile }}" \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg APP_RELEASE_NOTE="${APP_RELEASE_NOTE}" \
            --tag "local/${{ matrix.service }}:${{ github.sha }}" .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Export image
        run: docker save "local/${{ matrix.service }}:${{ github.sha }}" --output "${{ matrix.service }}.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}.tar
          retention-days: 1

  publish:
    name: Publish ${{ matrix.service }} image
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, client]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}

      - name: Load image
        run: docker load --input "${{ matrix.service }}.tar"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare image tags
        run: |
          IMAGE="$(printf '%s' "${IMAGE_NAMESPACE}/${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')"
          docker tag "local/${{ matrix.service }}:${{ github.sha }}" "${IMAGE}:${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag "local/${{ matrix.service }}:${{ github.sha }}" "${IMAGE}:latest"
          fi
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Push commit tag
        run: docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Push latest tag
        if: github.ref == 'refs/heads/main'
        run: docker push "${IMAGE}:latest"

      - name: Push version tag
        # refs/tags/v1.2.0 -> ghcr.io/<owner>/backend:1.2.0 (the tag Argo CD deploys).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "local/${{ matrix.service }}:${{ github.sha }}" "${IMAGE}:${GITHUB_REF_NAME#v}"
          docker push "${IMAGE}:${GITHUB_REF_NAME#v}"
