# Reproducible baseline load profile (Lab 4). Run from load-tests/:
#   locust --config locust.conf
# Override any value on the CLI, e.g.  -u 100 --csv results/run_100u --html results/run_100u.html
locustfile = locustfile.py
host = http://localhost:8000
headless = true
users = 50
spawn-rate = 5
run-time = 5m
stop-timeout = 10
csv = results/run_50u
csv-full-history = true
html = results/run_50u.html
only-summary = true
loglevel = WARNING
