# Development overlay — hot reload without rebuilding the image.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Merged on top of docker-compose.yml: same db/volume/networks/entrypoint (migrations
# still run), but the web source is bind-mounted and served by `uvicorn --reload`.
# Deliberately NOT named docker-compose.override.yml: that file is auto-loaded by a bare
# `docker compose up`, and the production stack must stay free of bind mounts and reload.

services:
  web:
    image: portal-web:dev
    environment:
      DEBUG: "True"
    volumes:
      # Host code replaces the code baked into the image (read-only: the container never edits it).
      - ./multidimensional-portal-generator:/app:ro
    command:
      - uvicorn
      - src.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=src
      - --reload-dir=migrations
    restart: "no"
