# values-dev.yaml — dev-профіль. Перекриває values.yaml:
#   helm install portal chart/portal -n dudko-helm --create-namespace -f chart/portal/values-dev.yaml
replicaCount: 1

image:
  tag: "1.0.0"

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi

config:
  ENVIRONMENT: "sandbox"
  LOG_LEVEL: "DEBUG"

ingress:
  enabled: false                # у dev відкриваємо через kubectl port-forward
  host: portal-helm.local       # використовується, якщо ввімкнути: --set ingress.enabled=true
