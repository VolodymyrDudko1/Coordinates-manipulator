{{- /*
Pre-upgrade hook (Task 9, варіант b): Job, який Helm запускає ПЕРЕД застосуванням
змін під час `helm upgrade` і чекає на його успішне завершення.
  "helm.sh/hook": pre-upgrade      => коли запускати (не при install, лише при upgrade)
  "helm.sh/hook-delete-policy"     => before-hook-creation: видалити старий Job перед новим;
                                      hook-succeeded: видалити Job після успіху
  .Release.Revision                => номер НОВОЇ ревізії, яка зараз розгортається
*/}}
{{- if .Values.hooks.preUpgrade.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "portal.componentName" (dict "root" $ "component" "pre-upgrade") }}
  labels:
    {{- include "portal.labels" (dict "root" $ "component" "pre-upgrade-hook") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": {{ .Values.hooks.preUpgrade.deletePolicy | quote }}
spec:
  backoffLimit: 0                 # одна спроба: невдалий hook => невдалий upgrade
  template:
    metadata:
      labels:
        {{- include "portal.labels" (dict "root" $ "component" "pre-upgrade-hook") | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: pre-upgrade
          image: "{{ .Values.utilityImage.repository }}:{{ .Values.utilityImage.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "=== Helm pre-upgrade hook ==="
              echo "Release:   {{ .Release.Name }}"
              echo "Namespace: {{ .Release.Namespace }}"
              echo "Revision:  {{ .Release.Revision }}"
              echo "Image:     {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              echo "Chart:     {{ .Chart.Name }}-{{ .Chart.Version }}"
              echo "Pre-upgrade checks passed"
{{- end }}
