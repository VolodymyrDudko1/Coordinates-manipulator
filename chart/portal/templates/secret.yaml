{{- /*
Secret: паролі та ключі (аналог k8s/11-secret.yaml).
  .Values.secrets.*   => значення з values (за замовчуванням фейкові "dev-only-not-real...")
  toString | b64enc   => поле data вимагає base64; b64enc кодує рядок (це НЕ шифрування!)
Реальні секрети передавайте через --set secrets.KEY=... або файл поза Git.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portal.componentName" (dict "root" $ "component" "secret") }}
  labels:
    {{- include "portal.labels" (dict "root" $ "component" "secret") | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
