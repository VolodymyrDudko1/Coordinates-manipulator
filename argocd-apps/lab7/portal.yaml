# Application застосунку (Lab 7): той самий чарт + envs/minikube/values-lab7.yaml
# (Rollout з кроком analysis, ServiceMonitor, PrometheusRule, дашборд). Застосовує root-lab7.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"    # після моніторингу (-2) і argo-rollouts (-1)
  finalizers:
    # Видалення Application (зокрема каскадно разом із root) видаляє і його об'єкти в кластері.
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/VolodymyrDudko1/Coordinates-manipulator.git
    targetRevision: labs-5-7
    path: charts/portal
    helm:
      releaseName: portal         # => імена об'єктів portal-api, portal-db, ...
      valueFiles:
        - ../../envs/minikube/values.yaml
        - ../../envs/minikube/values-lab7.yaml  # тег 1.4.0+, failRate, canary з analysis, моніторинг
  destination:
    server: https://kubernetes.default.svc
    namespace: dudko-gitops
  syncPolicy:
    automated:
      prune: true                 # прибрати з кластера те, що прибрали з Git
      selfHeal: true              # ручні зміни повертаються з Git (abort/promote Rollout spec не змінюють)
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true  # CRD Rollout/ServiceMonitor з'являються після wave -2/-1
    retry:                                # перший sync може випередити CRD — повторити
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 1m}
  revisionHistoryLimit: 10
