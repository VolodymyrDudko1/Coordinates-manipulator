{{- /*
Deployment PostgreSQL (аналог k8s/13-postgres-deployment.yaml).
  {{- if .Values.persistence.enabled }} ... {{- else }} ... {{- end }}
      => том із PVC, або emptyDir, якщо persistence вимкнено
  .Values.postgres.image.* => образ БД теж параметризований (без хардкоду тегу)
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portal.componentName" (dict "root" $ "component" "db") }}
  labels:
    {{- include "portal.labels" (dict "root" $ "component" "db" "version" .Values.postgres.image.tag) | nindent 4 }}
spec:
  replicas: 1                     # БД завжди одна: дві копії зіпсували б дані на RWO-диску
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "portal.selectorLabels" (dict "root" $ "component" "db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "portal.labels" (dict "root" $ "component" "db" "version" .Values.postgres.image.tag) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "portal.componentName" (dict "root" $ "component" "config") }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "portal.componentName" (dict "root" $ "component" "config") }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "portal.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA                # підкаталог: корінь тома може містити lost+found
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "portal.componentName" (dict "root" $ "component" "db-data") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
