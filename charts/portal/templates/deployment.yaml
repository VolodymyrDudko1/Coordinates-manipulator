{{- /*
Deployment застосунку portal-api (аналог k8s/20-deployment.yaml).
  .Values.replicaCount                      => кількість pod-ів (dev 1, prod 3)
  .Values.image.tag | default .Chart.AppVersion => тег образу; якщо порожній — appVersion з Chart.yaml
  toYaml .Values.resources | nindent 12     => перетворити вкладений словник values на YAML з відступом
  .Release.Revision                         => номер ревізії релізу (1, 2, 3 ...)
  sha256sum (include configmap.yaml)        => хеш відрендереного ConfigMap. Змінився config =>
                                               змінилась анотація pod-а => rolling update.
*/}}
{{- $apiName := include "portal.componentName" (dict "root" $ "component" "api") }}
{{- /* Lab 6: rollout.enabled=true => замість Deployment рендериться Rollout (rollout.yaml). */}}
{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $apiName }}
  labels:
    {{- include "portal.labels" (dict "root" $ "component" "api") | nindent 4 }}
  annotations:
    # Argo CD рендерить чарт через `helm template`, тому .Release.Revision тут завжди 1 — у change-cause лише образ.
    kubernetes.io/change-cause: {{ printf "Argo CD: %s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 10
  minReadySeconds: 5
  # Скільки чекати на прогрес rollout-у. Після цього Deployment => ProgressDeadlineExceeded,
  # і Argo CD показує застосунок Degraded (Lab 5 п.6b: неіснуючий тег образу).
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0           # нуль простою під час оновлення
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "portal.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  template:
    {{- include "portal.apiPodTemplate" . | nindent 4 }}
{{- end }}
