# Chart.yaml — паспорт чарту. Копія chart/portal з Lab 4, яку розвивають Lab 5–7
# (chart/portal лишається незмінним для демо Lab 4).
#   version    — версія САМОГО ЧАРТУ (шаблонів). Змінюємо, коли змінюються templates/ або values.
#   appVersion — версія ЗАСТОСУНКУ, який чарт розгортає = тег образу portal-api.
#                Використовується як тег за замовчуванням, якщо image.tag порожній.
apiVersion: v2
name: portal
description: FastAPI-генератор багатовимірних порталів (portal-api) + PostgreSQL — чарт під керуванням Argo CD (Lab 5–7)
type: application
version: 0.2.0
appVersion: "1.2.0"
