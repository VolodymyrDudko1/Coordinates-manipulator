# Production-like stack. One command:  docker compose up --build
#
#   host :8000 ──► web (gunicorn + uvicorn workers) ──[backend, internal]──► db (postgres:16-alpine)
#                                                                              └─ volume pgdata
#
# Dev mode with hot reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Optional Django dashboard: docker compose --profile client up --build   (http://localhost:8080)

name: portal   # fixed project name -> containers portal-web-1 / portal-db-1, volume portal_pgdata

services:
  db:
    image: postgres:16-alpine
    env_file: .env          # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB — only from .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    # Not published to the host by default. Uncomment only for local debugging (psql/DBeaver):
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-web:latest
    env_file: .env
    environment:
      # Built from the same POSTGRES_* values, so the app and the DB can never disagree.
      # Host "db" is the compose service name, resolved by Docker DNS on the backend network.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      PORT: 8000
    ports:
      - "${WEB_PORT:-8000}:8000"   # the only port published to the host
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend    # to reach db
      - frontend   # published port + optional client
    healthcheck:
      # /health runs SELECT 1, so "healthy" means "app is up AND can talk to the DB".
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s   # time for wait-for-db + migrations
    restart: unless-stopped

  client:
    profiles: ["client"]
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "8080:8080"
    environment:
      FASTAPI_BACKEND_URL: http://web:8000
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped

networks:
  backend:
    internal: true   # no route to the outside world; db is reachable only from web
  frontend: {}

volumes:
  pgdata:            # survives `docker compose down`; removed only by `down -v`
